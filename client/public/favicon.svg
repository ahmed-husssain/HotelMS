<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="22" fill="#0E1201"/>
  <!-- Stayza Concept 01: The Cantilevered Pavilion & Horizon -->
  <!-- Cantilevered Overhang Roof -->
  <path d="M 14 36 L 50 22 L 86 36" fill="none" stroke="#FAF8F5" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Monolithic Vertical Pylons -->
  <line x1="28" y1="38" x2="28" y2="78" stroke="#FAF8F5" stroke-width="3" stroke-linecap="round"/>
  <line x1="72" y1="38" x2="72" y2="78" stroke="#FAF8F5" stroke-width="3" stroke-linecap="round"/>
  <!-- Inner Sanctuary Portal Arch -->
  <path d="M 38 78 L 38 52 C 38 45.4 43.4 40 50 40 C 56.6 40 62 45.4 62 52 L 62 78" fill="none" stroke="#FAF8F5" stroke-width="2.2" stroke-linecap="round" opacity="0.5"/>
  <!-- Structural Travertine Lintel Base -->
  <line x1="16" y1="78" x2="84" y2="78" stroke="#FAF8F5" stroke-width="4" stroke-linecap="round"/>
  <!-- Coastal Horizon Hairline -->
  <line x1="24" y1="65" x2="76" y2="65" stroke="#FAF8F5" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
  <!-- Keystone Center Dot -->
  <circle cx="50" cy="50" r="4" fill="#FAF8F5"/>
</svg>
